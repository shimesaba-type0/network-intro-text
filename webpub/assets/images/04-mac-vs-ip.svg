<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220">
  <defs>
    <g id="pc2">
      <rect x="-30" y="-23" width="60" height="40" rx="4" fill="#ffffff" stroke="#233a5e" stroke-width="3"/>
      <rect x="-24" y="-17" width="48" height="28" fill="#eef1f6"/>
      <rect x="-5" y="17" width="10" height="9" fill="#233a5e"/>
      <rect x="-17" y="26" width="34" height="5" rx="2" fill="#233a5e"/>
    </g>
  </defs>

  <line x1="260" y1="15" x2="260" y2="205" stroke="#c9d2e3" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="260" cy="110" r="14" fill="#ffffff" stroke="#9aa7bd" stroke-width="1.5"/>
  <text x="260" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#9aa7bd">VS</text>

  <!-- ============ 左: MACアドレス ============ -->
  <g transform="translate(10,10)">
    <text x="120" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1f6f5c">MACアドレス</text>

    <use href="#pc2" x="120" y="55"/>

    <rect x="85" y="80" width="70" height="20" rx="3" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="120" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f6f5c">焼き付け済み</text>

    <text x="120" y="120" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f6f5c">00:1A:2B:3C:4D:5E</text>

    <text x="120" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f6f5c">製造時に固定（48ビット）</text>
    <text x="120" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f6f5c">同じセグメント内でだけ通じる</text>

    <rect x="70" y="180" width="100" height="26" rx="13" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="120" y="197" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f6f5c">＝名前</text>
  </g>

  <!-- ============ 右: IPアドレス ============ -->
  <g transform="translate(270,10)">
    <text x="120" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#8a5a1e">IPアドレス</text>

    <use href="#pc2" x="120" y="55"/>

    <rect x="85" y="80" width="70" height="20" rx="3" fill="#fbf1e2" stroke="#e0b374" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="120" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8a5a1e">付け替え可能</text>

    <text x="120" y="120" text-anchor="middle" font-family="monospace" font-size="11" fill="#8a5a1e">192.168.1.10</text>

    <text x="120" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8a5a1e">所属ネットワークで決まる（32ビット）</text>
    <text x="120" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8a5a1e">ネットワークをまたいで届く</text>

    <rect x="70" y="180" width="100" height="26" rx="13" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="120" y="197" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#8a5a1e">＝住所</text>
  </g>
</svg>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ネットワーク入門テキスト（仮）</title>
<style>
  body {
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
    max-width: 40rem;
    margin: 3rem auto;
    padding: 0 1.5rem;
    line-height: 1.8;
    color: #1a1a1a;
  }
  h1 { font-size: 1.4rem; }
  ul.links { list-style: none; padding: 0; }
  ul.links li { margin: 0.8rem 0; }
  ul.links a {
    display: inline-block;
    padding: 0.6em 1.2em;
    border: 1px solid #1f6f5c;
    border-radius: 4px;
    color: #1f6f5c;
    text-decoration: none;
  }
  ul.links a:hover { background: #1f6f5c; color: #fff; }
  footer { margin-top: 3rem; font-size: 0.8rem; color: #666; }
  footer a { color: inherit; }
</style>
</head>
<body>
<h1>ネットワーク入門テキスト（仮）</h1>

<ul class="links">
  <li><a id="web-link" href="#">Web版を読む（Vivliostyle Viewer）</a></li>
  <li><a href="./book.pdf">PDF版をダウンロード</a></li>
  <li><a href="./webpub/manuscript/90-license.html">ライセンスについて</a></li>
</ul>

<p>
  Web版は、このリポジトリでビルドしたWebPub（<code>webpub/publication.json</code>）を、
  <a href="https://vivliostyle.org/viewer/" target="_blank" rel="noopener">Vivliostyle Viewer（公式）</a>
  に読み込ませて表示しています。このリポジトリ自体はViewerを同梱していません。
</p>

<footer>
  © Takashi Kouno ・
  <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/legalcode" target="_blank" rel="noopener">
    CC BY-NC-ND 4.0
  </a>
</footer>

<script>
  (function () {
    var pubUrl = new URL("./webpub/publication.json", location.href).href;
    // Vivliostyle Viewerは #src= の値を生のURLとして読む（encodeURIComponentすると
    // Viewerが "https://" を認識できず、Viewer自身のオリジンに対する相対パスとして
    // 誤解釈してしまい 404 になる（Issue #3）。
    var viewerUrl = "https://vivliostyle.org/viewer/#src=" + pubUrl + "&bookMode=true";
    document.getElementById("web-link").href = viewerUrl;
  })();
</script>
</body>
</html>

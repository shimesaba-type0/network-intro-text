<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <g id="pc">
      <rect x="-30" y="-23" width="60" height="40" rx="4" fill="#ffffff" stroke="#233a5e" stroke-width="3"/>
      <rect x="-24" y="-17" width="48" height="28" fill="#eef1f6"/>
      <rect x="-5" y="17" width="10" height="9" fill="#233a5e"/>
      <rect x="-17" y="26" width="34" height="5" rx="2" fill="#233a5e"/>
    </g>
  </defs>

  <!-- 接続線（ハブ中心から各PCへ） -->
  <g stroke="#9aa7bd" stroke-width="3">
    <line x1="200" y1="200" x2="200" y2="60"/>
    <line x1="200" y1="200" x2="333" y2="157"/>
    <line x1="200" y1="200" x2="282" y2="313"/>
    <line x1="200" y1="200" x2="118" y2="313"/>
    <line x1="200" y1="200" x2="67" y2="157"/>
  </g>

  <!-- ハブ本体（中心） -->
  <g>
    <rect x="160" y="178" width="80" height="44" rx="6" fill="#fbf1e2" stroke="#e0b374" stroke-width="3"/>
    <circle cx="176" cy="222" r="3" fill="#e0b374"/>
    <circle cx="192" cy="222" r="3" fill="#e0b374"/>
    <circle cx="208" cy="222" r="3" fill="#e0b374"/>
    <circle cx="224" cy="222" r="3" fill="#e0b374"/>
    <text x="200" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#8a5a1e">HUB</text>
  </g>

  <!-- 周囲のPC -->
  <use href="#pc" x="200" y="60"/>
  <use href="#pc" x="333" y="157"/>
  <use href="#pc" x="282" y="313"/>
  <use href="#pc" x="118" y="313"/>
  <use href="#pc" x="67" y="157"/>
</svg>

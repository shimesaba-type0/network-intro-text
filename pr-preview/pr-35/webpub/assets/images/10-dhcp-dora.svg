<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260">
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">
    <rect x="20" y="10" width="100" height="36" rx="4" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="70" y="33" fill="#233a5e" font-weight="bold">CLIENT</text>

    <rect x="360" y="10" width="100" height="36" rx="4" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="410" y="33" fill="#1f6f5c" font-weight="bold">DHCP</text>

    <line x1="70" y1="46" x2="70" y2="240" stroke="#9aa7bd" stroke-width="1.5"/>
    <line x1="410" y1="46" x2="410" y2="240" stroke="#9aa7bd" stroke-width="1.5"/>
  </g>

  <defs>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#233a5e"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12">
    <line x1="70" y1="75" x2="410" y2="75" stroke="#233a5e" stroke-width="2" marker-end="url(#arrowD)"/>
    <text x="240" y="67" text-anchor="middle" fill="#233a5e" font-weight="bold">1: Discover (broadcast)</text>

    <line x1="410" y1="115" x2="70" y2="115" stroke="#1f6f5c" stroke-width="2" marker-end="url(#arrowD)"/>
    <text x="240" y="107" text-anchor="middle" fill="#1f6f5c" font-weight="bold">2: Offer</text>

    <line x1="70" y1="155" x2="410" y2="155" stroke="#233a5e" stroke-width="2" marker-end="url(#arrowD)"/>
    <text x="240" y="147" text-anchor="middle" fill="#233a5e" font-weight="bold">3: Request</text>

    <line x1="410" y1="195" x2="70" y2="195" stroke="#1f6f5c" stroke-width="2" marker-end="url(#arrowD)"/>
    <text x="240" y="187" text-anchor="middle" fill="#1f6f5c" font-weight="bold">4: Acknowledge</text>

    <text x="240" y="230" text-anchor="middle" fill="#9aa7bd" font-size="12">IP address leased</text>
  </g>
</svg>

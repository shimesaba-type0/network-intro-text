<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <g id="pc">
      <rect x="-30" y="-23" width="60" height="40" rx="4" fill="#ffffff" stroke="#233a5e" stroke-width="3"/>
      <rect x="-24" y="-17" width="48" height="28" fill="#eef1f6"/>
      <rect x="-5" y="17" width="10" height="9" fill="#233a5e"/>
      <rect x="-17" y="26" width="34" height="5" rx="2" fill="#233a5e"/>
    </g>
    <polygon id="arrow" points="9,0 -6,-6 -6,6" fill="#233a5e"/>
  </defs>

  <!-- 共有回線 -->
  <line x1="70" y1="100" x2="330" y2="100" stroke="#9aa7bd" stroke-width="3"/>

  <!-- 両側から同時に送信 -->
  <line x1="70" y1="100" x2="185" y2="100" stroke="#233a5e" stroke-width="3"/>
  <use href="#arrow" transform="translate(185,100)"/>
  <line x1="330" y1="100" x2="215" y2="100" stroke="#233a5e" stroke-width="3"/>
  <use href="#arrow" transform="translate(215,100) rotate(180)"/>

  <!-- 衝突地点 -->
  <g stroke="#c0392b" stroke-width="4" stroke-linecap="round">
    <line x1="188" y1="83" x2="212" y2="117"/>
    <line x1="212" y1="83" x2="188" y2="117"/>
  </g>

  <use href="#pc" x="70" y="100"/>
  <use href="#pc" x="330" y="100"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260">
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <rect x="20" y="10" width="90" height="36" rx="4" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="65" y="33" fill="#233a5e" font-weight="bold">CLIENT</text>

    <rect x="370" y="10" width="90" height="36" rx="4" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="415" y="33" fill="#1f6f5c" font-weight="bold">SERVER</text>

    <line x1="65" y1="46" x2="65" y2="240" stroke="#9aa7bd" stroke-width="1.5"/>
    <line x1="415" y1="46" x2="415" y2="240" stroke="#9aa7bd" stroke-width="1.5"/>
  </g>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#233a5e"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12">
    <line x1="65" y1="80" x2="415" y2="80" stroke="#233a5e" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="240" y="72" text-anchor="middle" fill="#233a5e" font-weight="bold">1: SYN</text>

    <line x1="415" y1="130" x2="65" y2="130" stroke="#1f6f5c" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="240" y="122" text-anchor="middle" fill="#1f6f5c" font-weight="bold">2: SYN + ACK</text>

    <line x1="65" y1="180" x2="415" y2="180" stroke="#233a5e" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="240" y="172" text-anchor="middle" fill="#233a5e" font-weight="bold">3: ACK</text>

    <text x="240" y="220" text-anchor="middle" fill="#9aa7bd" font-size="12">connection established</text>
  </g>
</svg>

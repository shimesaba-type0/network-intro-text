<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560">
  <defs>
    <polygon id="flow-arrow2" points="8,0 -6,-5 -6,5" fill="#d9730d"/>
    <polygon id="flow-arrow-navy" points="8,0 -6,-5 -6,5" fill="#233a5e"/>
    <polygon id="flow-arrow-red" points="8,0 -6,-5 -6,5" fill="#c0392b"/>
  </defs>

  <!-- ============ Panel 1: 通常の階層構成 ============ -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="320" height="260" rx="10" fill="#fbfbfd" stroke="#c9d2e3" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="13" fill="#233a5e"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">1</text>
    <text x="180" y="25" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">通常の階層構成</text>

    <rect x="125" y="40" width="70" height="28" rx="5" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="160" y="58" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Router</text>

    <rect x="28" y="96" width="64" height="28" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="60" y="114" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW1</text>
    <rect x="128" y="96" width="64" height="28" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="160" y="114" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW2</text>
    <rect x="228" y="96" width="64" height="28" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="260" y="114" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW3</text>

    <line x1="140" y1="68" x2="60" y2="96" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="160" y1="68" x2="160" y2="96" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="180" y1="68" x2="260" y2="96" stroke="#9aa7bd" stroke-width="2"/>

    <use href="#flow-arrow-navy" transform="translate(220,82) rotate(199)"/>
    <use href="#flow-arrow-navy" transform="translate(100,82) rotate(161)"/>
    <use href="#flow-arrow-navy" transform="translate(160,82) rotate(90)"/>

    <g stroke="#233a5e" stroke-width="1.5" fill="#eef1f6">
      <circle cx="52" cy="144" r="4"/><circle cx="68" cy="144" r="4"/>
      <circle cx="152" cy="144" r="4"/><circle cx="168" cy="144" r="4"/>
      <circle cx="252" cy="144" r="4"/><circle cx="268" cy="144" r="4"/>
    </g>
    <line x1="60" y1="124" x2="60" y2="138" stroke="#9aa7bd" stroke-width="1.5"/>
    <line x1="160" y1="124" x2="160" y2="138" stroke="#9aa7bd" stroke-width="1.5"/>
    <line x1="260" y1="124" x2="260" y2="138" stroke="#233a5e" stroke-width="1.5"/>

    <text x="288" y="150" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">ARP</text>

    <text x="160" y="226" text-anchor="middle" fill="#4a5568" font-family="Arial, Helvetica, sans-serif" font-size="11">
      <tspan x="160" dy="0">ループがなければ、SW3のPCが送った</tspan>
      <tspan x="160" dy="16">ARPも全員に1回ずつ届いて終わる</tspan>
    </text>
  </g>

  <!-- ============ Panel 2: 冗長化してみたらループに ============ -->
  <g transform="translate(350,10)">
    <rect x="0" y="0" width="320" height="260" rx="10" fill="#fbfbfd" stroke="#c9d2e3" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="13" fill="#233a5e"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">2</text>
    <text x="180" y="25" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">冗長化 → ループ化</text>

    <rect x="125" y="40" width="70" height="28" rx="5" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="160" y="58" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Router</text>

    <rect x="28" y="96" width="64" height="28" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="60" y="114" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW1</text>
    <rect x="128" y="96" width="64" height="28" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="160" y="114" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW2</text>
    <rect x="228" y="96" width="64" height="28" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="260" y="114" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW3</text>

    <line x1="140" y1="68" x2="60" y2="96" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="160" y1="68" x2="160" y2="96" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="180" y1="68" x2="260" y2="96" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="92" y1="104" x2="128" y2="104" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="92" y1="116" x2="128" y2="116" stroke="#9aa7bd" stroke-width="2"/>

    <g stroke="#233a5e" stroke-width="1.5" fill="#eef1f6">
      <circle cx="52" cy="144" r="4"/><circle cx="68" cy="144" r="4"/>
      <circle cx="152" cy="144" r="4"/><circle cx="168" cy="144" r="4"/>
      <circle cx="252" cy="144" r="4"/><circle cx="268" cy="144" r="4"/>
    </g>
    <line x1="60" y1="124" x2="60" y2="138" stroke="#9aa7bd" stroke-width="1.5"/>
    <line x1="160" y1="124" x2="160" y2="138" stroke="#9aa7bd" stroke-width="1.5"/>
    <line x1="260" y1="124" x2="260" y2="138" stroke="#9aa7bd" stroke-width="1.5"/>

    <text x="160" y="230" text-anchor="middle" fill="#4a5568" font-family="Arial, Helvetica, sans-serif" font-size="11">
      <tspan x="160" dy="0">SW1とSW2を、万一に備えて2本の回線で</tspan>
      <tspan x="160" dy="16">直接つないだら、気づけばループに</tspan>
    </text>
  </g>

  <!-- ============ Panel 3: ブロードキャストが循環 ============ -->
  <g transform="translate(10,290)">
    <rect x="0" y="0" width="320" height="260" rx="10" fill="#fbfbfd" stroke="#c9d2e3" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="13" fill="#233a5e"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">3</text>
    <text x="180" y="25" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">ブロードキャスト発生</text>

    <rect x="125" y="40" width="70" height="28" rx="5" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="160" y="58" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Router</text>

    <rect x="28" y="96" width="64" height="28" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="60" y="114" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW1</text>
    <rect x="128" y="96" width="64" height="28" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="160" y="114" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW2</text>
    <rect x="228" y="96" width="64" height="28" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="260" y="114" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW3</text>

    <line x1="180" y1="68" x2="260" y2="96" stroke="#9aa7bd" stroke-width="2"/>

    <line x1="140" y1="68" x2="60" y2="96" stroke="#d9730d" stroke-width="1.5"/>
    <line x1="160" y1="68" x2="160" y2="96" stroke="#d9730d" stroke-width="1.5"/>
    <use href="#flow-arrow2" transform="translate(100,82) rotate(199)"/>
    <use href="#flow-arrow2" transform="translate(160,82) rotate(-90)"/>

    <line x1="92" y1="104" x2="128" y2="104" stroke="#d9730d" stroke-width="2.5"/>
    <line x1="92" y1="116" x2="128" y2="116" stroke="#d9730d" stroke-width="2.5"/>
    <use href="#flow-arrow2" transform="translate(110,104) rotate(0)"/>
    <use href="#flow-arrow2" transform="translate(110,116) rotate(180)"/>

    <g stroke="#233a5e" stroke-width="1.5" fill="#eef1f6">
      <circle cx="52" cy="144" r="4"/><circle cx="68" cy="144" r="4"/>
      <circle cx="152" cy="144" r="4"/><circle cx="168" cy="144" r="4"/>
      <circle cx="252" cy="144" r="4"/><circle cx="268" cy="144" r="4"/>
    </g>
    <line x1="60" y1="124" x2="60" y2="138" stroke="#d9730d" stroke-width="1.5"/>
    <line x1="160" y1="124" x2="160" y2="138" stroke="#9aa7bd" stroke-width="1.5"/>
    <line x1="260" y1="124" x2="260" y2="138" stroke="#9aa7bd" stroke-width="1.5"/>

    <text x="30" y="150" text-anchor="middle" fill="#d9730d" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">ARP</text>

    <text x="160" y="230" text-anchor="middle" fill="#4a5568" font-family="Arial, Helvetica, sans-serif" font-size="11">
      <tspan x="160" dy="0">SW1配下のPCが送ったARPを、SW1とSW2</tspan>
      <tspan x="160" dy="16">が2本の回線でお互いにコピーし合う</tspan>
    </text>
  </g>

  <!-- ============ Panel 4: ブロードキャストストーム ============ -->
  <g transform="translate(350,290)">
    <rect x="0" y="0" width="320" height="260" rx="10" fill="#fdf1ef" stroke="#c9d2e3" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="13" fill="#233a5e"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">4</text>
    <text x="180" y="25" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">ストーム発生</text>

    <rect x="125" y="40" width="70" height="28" rx="5" fill="#eef1f6" stroke="#c0392b" stroke-width="2.5"/>
    <text x="160" y="58" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Router</text>
    <text x="196" y="36" text-anchor="middle" fill="#c0392b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">!</text>

    <rect x="28" y="96" width="64" height="28" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="60" y="114" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW1</text>
    <rect x="128" y="96" width="64" height="28" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="160" y="114" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW2</text>
    <rect x="228" y="96" width="64" height="28" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="260" y="114" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW3</text>

    <line x1="180" y1="68" x2="260" y2="96" stroke="#9aa7bd" stroke-width="2"/>

    <line x1="140" y1="68" x2="60" y2="96" stroke="#c0392b" stroke-width="2.5"/>
    <line x1="160" y1="68" x2="160" y2="96" stroke="#c0392b" stroke-width="2.5"/>
    <use href="#flow-arrow-red" transform="translate(100,82) rotate(199)"/>
    <use href="#flow-arrow-red" transform="translate(160,82) rotate(-90)"/>

    <line x1="92" y1="104" x2="128" y2="104" stroke="#c0392b" stroke-width="5"/>
    <line x1="92" y1="116" x2="128" y2="116" stroke="#c0392b" stroke-width="5"/>

    <g fill="#f4b942" stroke="#8a2b20" stroke-width="1">
      <rect x="96" y="90" width="7" height="7" transform="rotate(45,99.5,93.5)"/>
      <rect x="152" y="90" width="7" height="7" transform="rotate(45,155.5,93.5)"/>
      <rect x="96" y="124" width="7" height="7" transform="rotate(45,99.5,127.5)"/>
      <rect x="152" y="124" width="7" height="7" transform="rotate(45,155.5,127.5)"/>
    </g>

    <g stroke="#233a5e" stroke-width="1.5" fill="#eef1f6">
      <circle cx="52" cy="144" r="4"/><circle cx="68" cy="144" r="4"/>
      <circle cx="152" cy="144" r="4"/><circle cx="168" cy="144" r="4"/>
      <circle cx="252" cy="144" r="4"/><circle cx="268" cy="144" r="4"/>
    </g>
    <line x1="60" y1="124" x2="60" y2="138" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="160" y1="124" x2="160" y2="138" stroke="#9aa7bd" stroke-width="1.5"/>
    <line x1="260" y1="124" x2="260" y2="138" stroke="#9aa7bd" stroke-width="1.5"/>

    <text x="160" y="230" text-anchor="middle" fill="#8a2b20" font-family="Arial, Helvetica, sans-serif" font-size="11">
      <tspan x="160" dy="0">ループの外にいるSW3のユーザも、</tspan>
      <tspan x="160" dy="16">Routerの処理能力を奪われ巻き添えに</tspan>
    </text>
  </g>
</svg>

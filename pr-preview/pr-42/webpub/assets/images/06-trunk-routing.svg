<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260">
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">
    <rect x="20" y="90" width="180" height="50" rx="6" fill="#eef1f6" stroke="#233a5e" stroke-width="2.5"/>
    <text x="110" y="120" fill="#233a5e" font-weight="bold">SWITCH</text>

    <circle cx="60" cy="40" r="18" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="60" y="44" fill="#1f6f5c" font-size="10">VLAN10</text>
    <circle cx="160" cy="40" r="18" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="160" y="44" fill="#8a5a1e" font-size="10">VLAN20</text>
    <line x1="60" y1="58" x2="80" y2="90" stroke="#1f6f5c" stroke-width="2"/>
    <line x1="160" y1="58" x2="140" y2="90" stroke="#e0b374" stroke-width="2"/>

    <line x1="200" y1="115" x2="360" y2="115" stroke="#9aa7bd" stroke-width="3"/>
    <text x="280" y="103" fill="#233a5e" font-weight="bold" font-size="11">TRUNK</text>
    <text x="280" y="135" fill="#9aa7bd" font-size="9">VLAN 10+20, tagged</text>

    <rect x="360" y="90" width="180" height="50" rx="6" fill="#eef1f6" stroke="#233a5e" stroke-width="2.5"/>
    <text x="450" y="112" fill="#233a5e" font-weight="bold">ROUTER</text>
    <text x="450" y="128" fill="#233a5e" font-size="9">(or L3 switch / SVI)</text>

    <text x="360" y="180" fill="#1f6f5c" font-size="10">sub-if / SVI: VLAN 10 gateway</text>
    <text x="360" y="200" fill="#8a5a1e" font-size="10">sub-if / SVI: VLAN 20 gateway</text>
    <line x1="450" y1="140" x2="450" y2="170" stroke="#9aa7bd" stroke-width="2"/>
  </g>
</svg>

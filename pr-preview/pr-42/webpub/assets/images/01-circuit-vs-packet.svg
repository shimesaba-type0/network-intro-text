<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <g id="node">
      <circle r="14" fill="#eef1f6" stroke="#233a5e" stroke-width="2.5"/>
    </g>
    <polygon id="arrow" points="8,0 -5,-5 -5,5" fill="#233a5e"/>
  </defs>

  <text x="240" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#233a5e">CIRCUIT SWITCHING</text>

  <g stroke="#9aa7bd" stroke-width="6">
    <line x1="40" y1="80" x2="120" y2="80"/>
    <line x1="120" y1="80" x2="200" y2="80"/>
    <line x1="200" y1="80" x2="280" y2="80"/>
    <line x1="280" y1="80" x2="360" y2="80"/>
    <line x1="360" y1="80" x2="440" y2="80"/>
  </g>
  <g fill="#233a5e" stroke="none">
    <circle cx="40" cy="80" r="9"/>
    <circle cx="440" cy="80" r="9"/>
  </g>
  <g>
    <use href="#node" x="120" y="80"/>
    <use href="#node" x="200" y="80"/>
    <use href="#node" x="280" y="80"/>
    <use href="#node" x="360" y="80"/>
  </g>
  <text x="240" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#233a5e">PACKET SWITCHING</text>

  <g stroke="#9aa7bd" stroke-width="3" fill="none">
    <line x1="40" y1="230" x2="120" y2="230"/>
    <line x1="120" y1="230" x2="200" y2="200"/>
    <line x1="200" y1="200" x2="280" y2="230"/>
    <line x1="120" y1="230" x2="200" y2="260"/>
    <line x1="200" y1="260" x2="280" y2="230"/>
    <line x1="280" y1="230" x2="360" y2="200"/>
    <line x1="360" y1="200" x2="440" y2="230"/>
    <line x1="280" y1="230" x2="360" y2="260"/>
    <line x1="360" y1="260" x2="440" y2="230"/>
  </g>
  <g fill="#233a5e" stroke="none">
    <circle cx="40" cy="230" r="9"/>
    <circle cx="440" cy="230" r="9"/>
  </g>
  <use href="#node" x="120" y="230"/>
  <use href="#node" x="200" y="200"/>
  <use href="#node" x="200" y="260"/>
  <use href="#node" x="280" y="230"/>
  <use href="#node" x="360" y="200"/>
  <use href="#node" x="360" y="260"/>

  <use href="#arrow" transform="translate(160,215) rotate(-27)"/>
  <use href="#arrow" transform="translate(320,215) rotate(-27)"/>
</svg>

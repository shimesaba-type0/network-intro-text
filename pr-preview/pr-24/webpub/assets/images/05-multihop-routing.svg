<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <line x1="60" y1="40" x2="220" y2="40" stroke="#9aa7bd" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="300" y1="40" x2="410" y2="40" stroke="#9aa7bd" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="490" y1="40" x2="560" y2="40" stroke="#9aa7bd" stroke-width="2" marker-end="url(#arrow)"/>

    <circle cx="60" cy="40" r="24" fill="#eef1f6" stroke="#233a5e" stroke-width="2.5"/>
    <text x="60" y="45" fill="#233a5e" font-weight="bold">PC</text>

    <rect x="220" y="14" width="80" height="52" rx="6" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2.5"/>
    <text x="260" y="45" fill="#1f6f5c" font-weight="bold">R1</text>

    <rect x="410" y="14" width="80" height="52" rx="6" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2.5"/>
    <text x="450" y="45" fill="#1f6f5c" font-weight="bold">R2</text>

    <circle cx="590" cy="40" r="24" fill="#eef1f6" stroke="#233a5e" stroke-width="2.5"/>
    <text x="590" y="45" fill="#233a5e" font-weight="bold">Server</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9aa7bd"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12">
    <text x="20" y="115" fill="#233a5e" font-weight="bold">LINK: PC &#8594; R1</text>
    <rect x="20" y="128" width="130" height="36" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="85" y="151" fill="#8a5a1e" text-anchor="middle">Dst MAC: R1</text>
    <rect x="150" y="128" width="130" height="36" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="215" y="151" fill="#8a5a1e" text-anchor="middle">Src MAC: PC</text>
    <rect x="280" y="128" width="300" height="36" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="430" y="151" fill="#1f6f5c" text-anchor="middle">IP dst: Server / IP src: PC</text>

    <text x="20" y="205" fill="#233a5e" font-weight="bold">LINK: R1 &#8594; R2</text>
    <rect x="20" y="218" width="130" height="36" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="85" y="241" fill="#8a5a1e" text-anchor="middle">Dst MAC: R2</text>
    <rect x="150" y="218" width="130" height="36" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="215" y="241" fill="#8a5a1e" text-anchor="middle">Src MAC: R1</text>
    <rect x="280" y="218" width="300" height="36" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="430" y="241" fill="#1f6f5c" text-anchor="middle">IP dst: Server / IP src: PC</text>

    <text x="20" y="285" fill="#9aa7bd" font-size="12">MAC addresses change hop-by-hop; the IP addresses stay the same end to end.</text>
  </g>
</svg>

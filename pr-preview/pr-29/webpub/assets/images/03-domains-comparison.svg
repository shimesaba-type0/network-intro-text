<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200">
  <defs>
    <g id="host">
      <circle r="12" fill="#eef1f6" stroke="#233a5e" stroke-width="2.5"/>
    </g>
  </defs>

  <g transform="translate(10,10)">
    <text x="90" y="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#233a5e">HUB</text>
    <rect x="10" y="30" width="160" height="120" rx="4" fill="none" stroke="#233a5e" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="50" y1="60" x2="90" y2="120" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="130" y1="60" x2="90" y2="120" stroke="#9aa7bd" stroke-width="2"/>
    <use href="#host" x="50" y="60"/>
    <use href="#host" x="130" y="60"/>
    <rect x="70" y="112" width="40" height="16" rx="3" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="90" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#233a5e">collision = broadcast</text>
  </g>

  <g transform="translate(220,10)">
    <text x="90" y="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#233a5e">SWITCH</text>
    <rect x="10" y="30" width="160" height="120" rx="4" fill="none" stroke="#233a5e" stroke-width="2.5"/>
    <line x1="50" y1="60" x2="90" y2="120" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="130" y1="60" x2="90" y2="120" stroke="#9aa7bd" stroke-width="2"/>
    <rect x="30" y="42" width="40" height="36" rx="10" fill="none" stroke="#1f6f5c" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="110" y="42" width="40" height="36" rx="10" fill="none" stroke="#1f6f5c" stroke-width="1.5" stroke-dasharray="3 3"/>
    <use href="#host" x="50" y="60"/>
    <use href="#host" x="130" y="60"/>
    <rect x="70" y="112" width="40" height="16" rx="3" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="90" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#233a5e">1 broadcast, per-port collision</text>
  </g>

  <g transform="translate(430,10)">
    <text x="90" y="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#233a5e">ROUTER</text>
    <rect x="10" y="30" width="65" height="120" rx="4" fill="none" stroke="#233a5e" stroke-width="2.5"/>
    <rect x="105" y="30" width="65" height="120" rx="4" fill="none" stroke="#233a5e" stroke-width="2.5"/>
    <line x1="42" y1="60" x2="90" y2="120" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="138" y1="60" x2="90" y2="120" stroke="#9aa7bd" stroke-width="2"/>
    <use href="#host" x="42" y="60"/>
    <use href="#host" x="138" y="60"/>
    <rect x="70" y="112" width="40" height="16" rx="3" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="90" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#233a5e">2 broadcast domains</text>
  </g>
</svg>

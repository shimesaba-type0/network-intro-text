<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 221" width="480" height="221">
  <!-- トポロジー: PC1 - Router - PC2 -->
  <rect x="10" y="12" width="85" height="36" rx="4" fill="#fbf1e2" stroke="#e0b374" stroke-width="2.5"/>
  <text x="52" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#8a5a1e">PC1</text>

  <rect x="197" y="12" width="86" height="36" rx="4" fill="#eef1f6" stroke="#233a5e" stroke-width="2.5"/>
  <text x="240" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#233a5e">Router</text>

  <rect x="385" y="12" width="85" height="36" rx="4" fill="#fbf1e2" stroke="#e0b374" stroke-width="2.5"/>
  <text x="427" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#8a5a1e">PC2</text>

  <line x1="95" y1="30" x2="194" y2="30" stroke="#233a5e" stroke-width="2"/>
  <polygon points="194,30 184,25 184,35" fill="#233a5e"/>
  <line x1="283" y1="30" x2="382" y2="30" stroke="#233a5e" stroke-width="2"/>
  <polygon points="382,30 372,25 372,35" fill="#233a5e"/>

  <circle cx="146" cy="30" r="10" fill="#233a5e"/>
  <text x="146" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="334" cy="30" r="10" fill="#233a5e"/>
  <text x="334" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">2</text>

  <text x="146" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#233a5e">① PC1 → Router</text>
  <text x="334" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#233a5e">② Router → PC2</text>

  <!-- ①のフレーム -->
  <text x="240" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#233a5e">①のフレーム（PC1 → Router間）</text>

  <rect x="10" y="88" width="140" height="32" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
  <text x="80" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1f6f5c">宛先MAC: Router</text>

  <rect x="155" y="88" width="140" height="32" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
  <text x="225" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1f6f5c">送信元MAC: PC1</text>

  <rect x="300" y="88" width="170" height="32" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
  <text x="385" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#8a5a1e">宛先IP: PC2</text>
  <text x="385" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#8a5a1e">送信元IP: PC1</text>

  <!-- 変化/不変の注記 -->
  <line x1="80" y1="120" x2="80" y2="140" stroke="#d9730d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="80" y="133" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#d9730d">≠</text>
  <text x="80" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#d9730d">書き換え</text>

  <line x1="225" y1="120" x2="225" y2="140" stroke="#d9730d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="225" y="133" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#d9730d">≠</text>
  <text x="225" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#d9730d">書き換え</text>

  <line x1="385" y1="120" x2="385" y2="140" stroke="#1f6f5c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="385" y="133" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1f6f5c">＝</text>
  <text x="385" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#1f6f5c">変わらない</text>

  <!-- ②のフレーム -->
  <text x="240" y="171" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#233a5e">②のフレーム（Router → PC2間）</text>

  <rect x="10" y="179" width="140" height="32" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
  <text x="80" y="199" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1f6f5c">宛先MAC: PC2</text>

  <rect x="155" y="179" width="140" height="32" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
  <text x="225" y="199" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1f6f5c">送信元MAC: Router</text>

  <rect x="300" y="179" width="170" height="32" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
  <text x="385" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#8a5a1e">宛先IP: PC2</text>
  <text x="385" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#8a5a1e">送信元IP: PC1</text>
</svg>

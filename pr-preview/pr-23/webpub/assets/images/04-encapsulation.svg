<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560" height="190">
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#233a5e">
    <text x="280" y="20" font-size="13" font-weight="bold">ETHERNET FRAME (L2)</text>

    <rect x="10" y="30" width="90" height="40" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="55" y="54" fill="#1f6f5c">Dst / Src MAC</text>

    <rect x="100" y="30" width="360" height="40" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="280" y="54" fill="#8a5a1e">IP Packet (payload)</text>

    <rect x="460" y="30" width="90" height="40" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="505" y="54">FCS</text>
  </g>

  <line x1="150" y1="70" x2="150" y2="100" stroke="#e0b374" stroke-width="2"/>
  <line x1="410" y1="70" x2="410" y2="100" stroke="#e0b374" stroke-width="2"/>
  <line x1="150" y1="100" x2="410" y2="100" stroke="#e0b374" stroke-width="2" stroke-dasharray="4 3"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#233a5e">
    <text x="280" y="125" font-size="13" font-weight="bold">IP PACKET (L3)</text>

    <rect x="150" y="135" width="120" height="40" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="210" y="159" fill="#233a5e">Dst / Src IP</text>

    <rect x="270" y="135" width="140" height="40" fill="#ffffff" stroke="#233a5e" stroke-width="2"/>
    <text x="340" y="159">Data</text>
  </g>
</svg>

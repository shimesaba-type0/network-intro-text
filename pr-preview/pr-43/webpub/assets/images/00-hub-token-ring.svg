<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <g id="pc">
      <rect x="-30" y="-23" width="60" height="40" rx="4" fill="#ffffff" stroke="#233a5e" stroke-width="3"/>
      <rect x="-24" y="-17" width="48" height="28" fill="#eef1f6"/>
      <rect x="-5" y="17" width="10" height="9" fill="#233a5e"/>
      <rect x="-17" y="26" width="34" height="5" rx="2" fill="#233a5e"/>
    </g>
  </defs>

  <!-- 集線装置から各PCへの個別配線 -->
  <g stroke="#9aa7bd" stroke-width="3">
    <line x1="200" y1="200" x2="200" y2="60"/>
    <line x1="200" y1="200" x2="333" y2="157"/>
    <line x1="200" y1="200" x2="282" y2="313"/>
    <line x1="200" y1="200" x2="118" y2="313"/>
    <line x1="200" y1="200" x2="67" y2="157"/>
  </g>

  <!-- 集線装置本体。外から見ると星形配線だが、内部では輪とトークンを維持している -->
  <g>
    <rect x="140" y="155" width="120" height="90" rx="10" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="3"/>
    <circle cx="200" cy="188" r="20" fill="none" stroke="#1f6f5c" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="200" cy="168" r="4" fill="#1f6f5c"/>
    <circle cx="220" cy="188" r="2.5" fill="#1f6f5c"/>
    <circle cx="200" cy="208" r="2.5" fill="#1f6f5c"/>
    <circle cx="180" cy="188" r="2.5" fill="#1f6f5c"/>
    <text x="200" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f6f5c">MAU</text>
  </g>

  <!-- 周囲のPC -->
  <use href="#pc" x="200" y="60"/>
  <use href="#pc" x="333" y="157"/>
  <use href="#pc" x="282" y="313"/>
  <use href="#pc" x="118" y="313"/>
  <use href="#pc" x="67" y="157"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#233a5e">
    <text x="320" y="20" font-size="13" font-weight="bold">ETHERNET FRAME WITH 802.1Q TAG</text>

    <rect x="10" y="35" width="70" height="40" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="45" y="59" font-size="10">Dst MAC</text>

    <rect x="80" y="35" width="70" height="40" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="115" y="59" font-size="10">Src MAC</text>

    <rect x="150" y="35" width="110" height="40" fill="#fbf1e2" stroke="#e0b374" stroke-width="2.5"/>
    <text x="205" y="53" fill="#8a5a1e" font-size="10">802.1Q Tag</text>
    <text x="205" y="67" fill="#8a5a1e" font-size="9">TPID + VID (12bit)</text>

    <rect x="260" y="35" width="60" height="40" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="290" y="59" font-size="10">Type</text>

    <rect x="320" y="35" width="220" height="40" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="430" y="59" fill="#1f6f5c" font-size="11">Payload</text>

    <rect x="540" y="35" width="90" height="40" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="585" y="59" font-size="10">FCS</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#8a5a1e">
    <line x1="205" y1="75" x2="205" y2="100" stroke="#e0b374" stroke-width="2"/>
    <text x="205" y="118">inserted between Src MAC and Type</text>
    <text x="205" y="134">VID: 4094 usable IDs (0 and 4095 reserved)</text>
  </g>
</svg>

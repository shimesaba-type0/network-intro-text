<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560">
  <defs>
    <polygon id="flow-arrow2" points="8,0 -6,-5 -6,5" fill="#d9730d"/>
    <polygon id="flow-arrow-navy" points="8,0 -6,-5 -6,5" fill="#233a5e"/>
    <polygon id="flow-arrow-red" points="8,0 -6,-5 -6,5" fill="#c0392b"/>
  </defs>

  <!-- ============ Panel 1: 通常の階層構成（ループなし） ============ -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="320" height="260" rx="10" fill="#fbfbfd" stroke="#c9d2e3" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="13" fill="#233a5e"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">1</text>
    <text x="180" y="25" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">通常の階層構成</text>

    <rect x="125" y="35" width="70" height="26" rx="5" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="160" y="52" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Router</text>

    <rect x="125" y="90" width="70" height="26" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="160" y="107" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW1</text>
    <rect x="28" y="145" width="64" height="26" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="60" y="162" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW2</text>
    <rect x="228" y="145" width="64" height="26" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="260" y="162" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW3</text>

    <line x1="160" y1="61" x2="160" y2="90" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="138" y1="116" x2="60" y2="145" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="182" y1="116" x2="260" y2="145" stroke="#9aa7bd" stroke-width="2"/>

    <use href="#flow-arrow-navy" transform="translate(99,131) rotate(340)"/>
    <use href="#flow-arrow-navy" transform="translate(160,76) rotate(-90)"/>
    <use href="#flow-arrow-navy" transform="translate(221,131) rotate(20)"/>

    <line x1="60" y1="171" x2="60" y2="183" stroke="#233a5e" stroke-width="1.5"/>
    <line x1="260" y1="171" x2="260" y2="183" stroke="#233a5e" stroke-width="1.5"/>
    <g stroke="#233a5e" stroke-width="1.5" fill="#eef1f6">
      <circle cx="52" cy="188" r="4"/><circle cx="68" cy="188" r="4"/>
      <circle cx="252" cy="188" r="4"/><circle cx="268" cy="188" r="4"/>
    </g>
    <text x="60" y="202" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold">ブロードキャスト発信元</text>

    <text x="160" y="228" text-anchor="middle" fill="#4a5568" font-family="Arial, Helvetica, sans-serif" font-size="11">
      <tspan x="160" dy="0">ループがなければ、SW2のPCが送った</tspan>
      <tspan x="160" dy="16">ブロードキャストも全員に1回ずつ届いて終わる</tspan>
    </text>
  </g>

  <!-- ============ Panel 2: 冗長化してみたらループに ============ -->
  <g transform="translate(350,10)">
    <rect x="0" y="0" width="320" height="260" rx="10" fill="#fbfbfd" stroke="#c9d2e3" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="13" fill="#233a5e"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">2</text>
    <text x="180" y="25" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">冗長化 → ループ化</text>

    <rect x="125" y="35" width="70" height="26" rx="5" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="160" y="52" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Router</text>

    <rect x="125" y="90" width="70" height="26" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="160" y="107" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW1</text>
    <rect x="28" y="145" width="64" height="26" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="60" y="162" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW2</text>
    <rect x="228" y="145" width="64" height="26" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="260" y="162" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW3</text>

    <line x1="160" y1="61" x2="160" y2="90" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="138" y1="116" x2="60" y2="145" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="182" y1="116" x2="260" y2="145" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="92" y1="158" x2="228" y2="158" stroke="#9aa7bd" stroke-width="2.5"/>

    <line x1="60" y1="171" x2="60" y2="183" stroke="#9aa7bd" stroke-width="1.5"/>
    <line x1="260" y1="171" x2="260" y2="183" stroke="#9aa7bd" stroke-width="1.5"/>
    <g stroke="#233a5e" stroke-width="1.5" fill="#eef1f6">
      <circle cx="52" cy="188" r="4"/><circle cx="68" cy="188" r="4"/>
      <circle cx="252" cy="188" r="4"/><circle cx="268" cy="188" r="4"/>
    </g>

    <text x="160" y="228" text-anchor="middle" fill="#4a5568" font-family="Arial, Helvetica, sans-serif" font-size="11">
      <tspan x="160" dy="0">SW1が止まったときの保険に、SW2・SW3間</tspan>
      <tspan x="160" dy="16">にもう1本つないだら、気づけばループに</tspan>
    </text>
  </g>

  <!-- ============ Panel 3: ブロードキャストが循環 ============ -->
  <g transform="translate(10,290)">
    <rect x="0" y="0" width="320" height="260" rx="10" fill="#fbfbfd" stroke="#c9d2e3" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="13" fill="#233a5e"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">3</text>
    <text x="180" y="25" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">ブロードキャストが循環</text>

    <rect x="125" y="35" width="70" height="26" rx="5" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="160" y="52" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Router</text>

    <rect x="125" y="90" width="70" height="26" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="160" y="107" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW1</text>
    <rect x="28" y="145" width="64" height="26" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="60" y="162" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW2</text>
    <rect x="228" y="145" width="64" height="26" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="260" y="162" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW3</text>

    <line x1="160" y1="61" x2="160" y2="90" stroke="#9aa7bd" stroke-width="2"/>
    <line x1="138" y1="116" x2="60" y2="145" stroke="#d9730d" stroke-width="2.5"/>
    <line x1="182" y1="116" x2="260" y2="145" stroke="#d9730d" stroke-width="2.5"/>
    <line x1="92" y1="158" x2="228" y2="158" stroke="#d9730d" stroke-width="2.5"/>

    <use href="#flow-arrow2" transform="translate(99,131) rotate(160)"/>
    <use href="#flow-arrow2" transform="translate(160,158) rotate(0)"/>
    <use href="#flow-arrow2" transform="translate(221,131) rotate(200)"/>

    <g fill="#f4b942" stroke="#8a2b20" stroke-width="1">
      <rect x="95" y="128" width="6" height="6" transform="rotate(45,98,131)"/>
      <rect x="220" y="128" width="6" height="6" transform="rotate(45,223,131)"/>
      <rect x="157" y="150" width="6" height="6" transform="rotate(45,160,153)"/>
    </g>

    <line x1="60" y1="171" x2="60" y2="183" stroke="#d9730d" stroke-width="1.5"/>
    <line x1="260" y1="171" x2="260" y2="183" stroke="#9aa7bd" stroke-width="1.5"/>
    <g stroke="#233a5e" stroke-width="1.5" fill="#eef1f6">
      <circle cx="52" cy="188" r="4"/><circle cx="68" cy="188" r="4"/>
      <circle cx="252" cy="188" r="4"/><circle cx="268" cy="188" r="4"/>
    </g>
    <text x="60" y="202" text-anchor="middle" fill="#d9730d" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold">ブロードキャスト発信元</text>

    <text x="160" y="228" text-anchor="middle" fill="#4a5568" font-family="Arial, Helvetica, sans-serif" font-size="11">
      <tspan x="160" dy="0">SW2配下のPCが送ったブロードキャストが、</tspan>
      <tspan x="160" dy="16">ループの中をぐるぐる回り続ける</tspan>
    </text>
  </g>

  <!-- ============ Panel 4: ブロードキャストストーム ============ -->
  <g transform="translate(350,290)">
    <rect x="0" y="0" width="320" height="260" rx="10" fill="#fdf1ef" stroke="#c9d2e3" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="13" fill="#233a5e"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">4</text>
    <text x="180" y="25" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">ストーム発生</text>

    <rect x="125" y="35" width="70" height="26" rx="5" fill="#eef1f6" stroke="#c0392b" stroke-width="2.5"/>
    <text x="160" y="52" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Router</text>
    <text x="198" y="42" text-anchor="middle" fill="#c0392b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">!</text>

    <rect x="125" y="90" width="70" height="26" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="160" y="107" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW1</text>
    <rect x="28" y="145" width="64" height="26" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="60" y="162" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW2</text>
    <rect x="228" y="145" width="64" height="26" rx="5" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="260" y="162" text-anchor="middle" fill="#8a5a1e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">SW3</text>

    <line x1="160" y1="61" x2="160" y2="90" stroke="#c0392b" stroke-width="4"/>
    <line x1="138" y1="116" x2="60" y2="145" stroke="#c0392b" stroke-width="5"/>
    <line x1="182" y1="116" x2="260" y2="145" stroke="#c0392b" stroke-width="5"/>
    <line x1="92" y1="158" x2="228" y2="158" stroke="#c0392b" stroke-width="5"/>

    <g fill="#f4b942" stroke="#8a2b20" stroke-width="1">
      <rect x="95" y="100" width="7" height="7" transform="rotate(45,98.5,103.5)"/>
      <rect x="220" y="100" width="7" height="7" transform="rotate(45,223.5,103.5)"/>
      <rect x="95" y="128" width="7" height="7" transform="rotate(45,98.5,131.5)"/>
      <rect x="220" y="128" width="7" height="7" transform="rotate(45,223.5,131.5)"/>
      <rect x="150" y="150" width="7" height="7" transform="rotate(45,153.5,153.5)"/>
      <rect x="175" y="150" width="7" height="7" transform="rotate(45,178.5,153.5)"/>
      <rect x="150" y="70" width="7" height="7" transform="rotate(45,153.5,73.5)"/>
    </g>

    <line x1="60" y1="171" x2="60" y2="183" stroke="#9aa7bd" stroke-width="1.5"/>
    <line x1="260" y1="171" x2="260" y2="183" stroke="#9aa7bd" stroke-width="1.5"/>
    <g stroke="#233a5e" stroke-width="1.5" fill="#eef1f6">
      <circle cx="52" cy="188" r="4"/><circle cx="68" cy="188" r="4"/>
      <circle cx="252" cy="188" r="4"/><circle cx="268" cy="188" r="4"/>
    </g>

    <text x="160" y="228" text-anchor="middle" fill="#8a2b20" font-family="Arial, Helvetica, sans-serif" font-size="11">
      <tspan x="160" dy="0">ループの外にいるRouterも、</tspan>
      <tspan x="160" dy="16">処理能力を奪われ巻き添えに</tspan>
    </text>
  </g>
</svg>

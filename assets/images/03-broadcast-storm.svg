<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <polygon id="flow-arrow" points="8,0 -6,-5 -6,5" fill="#d9730d"/>
  </defs>

  <!-- ============ Panel 1: 単一回線 ============ -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="280" height="230" rx="10" fill="#fbfbfd" stroke="#c9d2e3" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="13" fill="#233a5e"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">1</text>
    <text x="150" y="25" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">シングル構成</text>

    <rect x="38" y="104" width="64" height="32" rx="6" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="70" y="124" text-anchor="middle" fill="#1f6f5c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">SW1</text>
    <rect x="178" y="104" width="64" height="32" rx="6" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="210" y="124" text-anchor="middle" fill="#1f6f5c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">SW2</text>

    <path d="M70,104 Q140,55 210,104" fill="none" stroke="#9aa7bd" stroke-width="2.5"/>

    <text x="140" y="205" text-anchor="middle" fill="#4a5568" font-family="Arial, Helvetica, sans-serif" font-size="11">
      <tspan x="140" dy="0">1本の回線だけの接続</tspan>
      <tspan x="140" dy="16">そこが切れたら全断になってしまう</tspan>
    </text>
  </g>

  <!-- ============ Panel 2: 冗長化してみたらループに ============ -->
  <g transform="translate(310,10)">
    <rect x="0" y="0" width="280" height="230" rx="10" fill="#fbfbfd" stroke="#c9d2e3" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="13" fill="#233a5e"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">2</text>
    <text x="150" y="25" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">冗長化 → ループ化</text>

    <rect x="38" y="104" width="64" height="32" rx="6" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="70" y="124" text-anchor="middle" fill="#1f6f5c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">SW1</text>
    <rect x="178" y="104" width="64" height="32" rx="6" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="210" y="124" text-anchor="middle" fill="#1f6f5c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">SW2</text>

    <path d="M70,104 Q140,55 210,104" fill="none" stroke="#9aa7bd" stroke-width="2.5"/>
    <path d="M70,136 Q140,185 210,136" fill="none" stroke="#9aa7bd" stroke-width="2.5"/>

    <text x="140" y="205" text-anchor="middle" fill="#4a5568" font-family="Arial, Helvetica, sans-serif" font-size="11">
      <tspan x="140" dy="0">もしもの時に備え、もう1本追加</tspan>
      <tspan x="140" dy="16">これで安心…のはずだったが</tspan>
    </text>
  </g>

  <!-- ============ Panel 3: ブロードキャストが循環 ============ -->
  <g transform="translate(10,260)">
    <rect x="0" y="0" width="280" height="230" rx="10" fill="#fbfbfd" stroke="#c9d2e3" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="13" fill="#233a5e"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">3</text>
    <text x="150" y="25" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">ブロードキャスト発生</text>

    <circle cx="16" cy="120" r="13" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="16" y="124" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="8">PC</text>
    <line x1="29" y1="120" x2="37" y2="120" stroke="#d9730d" stroke-width="2.5"/>
    <text x="22" y="105" text-anchor="middle" fill="#d9730d" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">ARP</text>

    <rect x="38" y="104" width="64" height="32" rx="6" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="70" y="124" text-anchor="middle" fill="#1f6f5c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">SW1</text>
    <rect x="178" y="104" width="64" height="32" rx="6" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="210" y="124" text-anchor="middle" fill="#1f6f5c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">SW2</text>

    <path d="M70,104 Q140,55 210,104" fill="none" stroke="#d9730d" stroke-width="2.5"/>
    <path d="M70,136 Q140,185 210,136" fill="none" stroke="#d9730d" stroke-width="2.5"/>

    <use href="#flow-arrow" transform="translate(126,80.5) rotate(-10)"/>
    <use href="#flow-arrow" transform="translate(154,80.5) rotate(15)"/>
    <use href="#flow-arrow" transform="translate(154,159.5) rotate(170)"/>
    <use href="#flow-arrow" transform="translate(126,159.5) rotate(195)"/>

    <text x="140" y="205" text-anchor="middle" fill="#4a5568" font-family="Arial, Helvetica, sans-serif" font-size="11">
      <tspan x="140" dy="0">ARPなどのブロードキャストが</tspan>
      <tspan x="140" dy="16">ループの中をぐるぐる回り続ける</tspan>
    </text>
  </g>

  <!-- ============ Panel 4: ブロードキャストストーム ============ -->
  <g transform="translate(310,260)">
    <rect x="0" y="0" width="280" height="230" rx="10" fill="#fdf1ef" stroke="#c9d2e3" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="13" fill="#233a5e"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">4</text>
    <text x="150" y="25" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">ストーム発生</text>

    <circle cx="16" cy="120" r="13" fill="#eef1f6" stroke="#233a5e" stroke-width="2"/>
    <text x="16" y="124" text-anchor="middle" fill="#233a5e" font-family="Arial, Helvetica, sans-serif" font-size="8">PC</text>

    <rect x="38" y="104" width="64" height="32" rx="6" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="70" y="124" text-anchor="middle" fill="#1f6f5c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">SW1</text>
    <rect x="178" y="104" width="64" height="32" rx="6" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="210" y="124" text-anchor="middle" fill="#1f6f5c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">SW2</text>

    <path d="M70,104 Q140,55 210,104" fill="none" stroke="#c0392b" stroke-width="5"/>
    <path d="M70,136 Q140,185 210,136" fill="none" stroke="#c0392b" stroke-width="5"/>

    <g fill="#f4b942" stroke="#8a2b20" stroke-width="1">
      <rect x="93" y="71" width="8" height="8" transform="rotate(45,97,75)"/>
      <rect x="122" y="63" width="8" height="8" transform="rotate(45,126,67)"/>
      <rect x="150" y="63" width="8" height="8" transform="rotate(45,154,67)"/>
      <rect x="179" y="71" width="8" height="8" transform="rotate(45,183,75)"/>
      <rect x="93" y="162" width="8" height="8" transform="rotate(45,97,166)"/>
      <rect x="122" y="170" width="8" height="8" transform="rotate(45,126,174)"/>
      <rect x="150" y="170" width="8" height="8" transform="rotate(45,154,174)"/>
      <rect x="179" y="162" width="8" height="8" transform="rotate(45,183,166)"/>
    </g>

    <rect x="106" y="108" width="68" height="26" rx="4" fill="#ffffff" fill-opacity="0.85"/>
    <text x="140" y="117" text-anchor="middle" fill="#c0392b" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold">ブロードキャスト</text>
    <text x="140" y="129" text-anchor="middle" fill="#c0392b" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold">ストーム</text>

    <text x="140" y="205" text-anchor="middle" fill="#8a2b20" font-family="Arial, Helvetica, sans-serif" font-size="11">
      <tspan x="140" dy="0">帯域を食いつぶし</tspan>
      <tspan x="140" dy="16">ネットワーク全体が止まってしまう</tspan>
    </text>
  </g>
</svg>

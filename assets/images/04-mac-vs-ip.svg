<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240">
  <defs>
    <g id="pc2">
      <rect x="-30" y="-23" width="60" height="40" rx="4" fill="#ffffff" stroke="#233a5e" stroke-width="3"/>
      <rect x="-24" y="-17" width="48" height="28" fill="#eef1f6"/>
      <rect x="-5" y="17" width="10" height="9" fill="#233a5e"/>
      <rect x="-17" y="26" width="34" height="5" rx="2" fill="#233a5e"/>
    </g>
  </defs>

  <line x1="260" y1="15" x2="260" y2="225" stroke="#c9d2e3" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="260" cy="120" r="14" fill="#ffffff" stroke="#9aa7bd" stroke-width="1.5"/>
  <text x="260" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#9aa7bd">VS</text>

  <!-- ============ 左: MACアドレス ============ -->
  <g transform="translate(10,10)">
    <text x="120" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1f6f5c">MACアドレス</text>

    <use href="#pc2" x="120" y="63"/>

    <rect x="85" y="97" width="70" height="20" rx="3" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="120" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#1f6f5c">焼き付け済み</text>

    <text x="120" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f6f5c">00:1A:2B:3C:4D:5E</text>

    <text x="120" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f6f5c">
      <tspan x="120" dy="0">製造時に固定・同じセグメント</tspan>
      <tspan x="120" dy="15">内でのみ意味を持つ（48ビット）</tspan>
    </text>

    <rect x="70" y="200" width="100" height="28" rx="14" fill="#e9f4f2" stroke="#1f6f5c" stroke-width="2"/>
    <text x="120" y="219" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f6f5c">＝名前</text>
  </g>

  <!-- ============ 右: IPアドレス ============ -->
  <g transform="translate(270,10)">
    <text x="120" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#8a5a1e">IPアドレス</text>

    <use href="#pc2" x="120" y="63"/>

    <rect x="85" y="97" width="70" height="20" rx="3" fill="#fbf1e2" stroke="#e0b374" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="120" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#8a5a1e">付け替え可能</text>

    <text x="120" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="#8a5a1e">192.168.1.10</text>

    <text x="120" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8a5a1e">
      <tspan x="120" dy="0">所属ネットワークで決まり、越境</tspan>
      <tspan x="120" dy="15">して機器を識別できる（32ビット）</tspan>
    </text>

    <rect x="70" y="200" width="100" height="28" rx="14" fill="#fbf1e2" stroke="#e0b374" stroke-width="2"/>
    <text x="120" y="219" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#8a5a1e">＝住所</text>
  </g>
</svg>
